repository = "leynos/claude-q"

# What the ratchet baseline measures: the publisher's generator must carry
# exactly these inputs, and every lane must measure the same selection.
[selection]
language = "python"
python-source = "./claude_q"
output-path = "coverage.xml"
format = "cobertura"
baseline-python-file = ".coverage-baseline.python"
pytest-workers = ""
with-ratchet = "true"
